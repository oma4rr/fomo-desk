<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grok Bot" />
  <meta name="theme-color" content="#000000" />
  <meta name="referrer" content="no-referrer" />
  <title>Grok Bot</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="offline" class="offline" hidden></div>
  <main id="view" class="view" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="tab on"><span class="ti"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-4.5v-6h-3v6H6v-9H3z"/></svg></span><span>Home</span></button>
    <button data-tab="bots" class="tab"><span class="ti"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="12" rx="4"/><circle cx="9" cy="13" r="1.5" fill="currentColor"/><circle cx="15" cy="13" r="1.5" fill="currentColor"/><path d="M12 7V4"/></svg></span><span>Bots</span></button>
    <button data-tab="activity" class="tab"><span class="ti"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg></span><span>Activity</span></button>
    <button data-tab="account" class="tab"><span class="ti"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span><span>Account</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="full" class="full" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
